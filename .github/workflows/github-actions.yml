      - name: "BrowserStack Env Setup"
        uses: browserstack/github-actions/setup-env@master
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          project-name: Ocaramba_Windows_BrowserStack
      - name: "Start BrowserStackLocal Tunnel"
        uses: "browserstack/github-actions/setup-local@master"
        with:
          local-testing: "start"
          local-logging-level: "all-logs"
          local-identifier: "random"
      - run: ./scripts/ExecutingTestsOnWindowsGithubActions4.ps1
        env:
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
      - name: "BrowserStack Build Report"
        uses: "browserstack/github-actions/browserstack-report-action@master"
        with:
          username: ${{ secrets.BROWSERSTACK_USERNAME }}
          access-key: ${{ secrets.BROWSERSTACK_USERNAME }}
          build-name: BUILD_INFO
          report-timeout: 10
        continue-on-error: true
      - name: Archive logs
        if: always()
        run: |
          $dest = "./Ocaramba.Tests.BrowserStack/bin/Release"
          Get-ChildItem -Path "./**/TestResults/*" -Recurse | Select-Object FullName
          Compress-Archive -Path "./**/TestResults/*" -DestinationPath "$dest/ExecutingTestsOnWindowsBrowserStackReport$env:GITHUB_RUN_ID.zip"
      - name: "Stop BrowserStackLocal"
        if: always()
        uses: "browserstack/github-actions/setup-local@master"
        with:
          local-testing: "stop"
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/windows@v2
        if: true
        with:
          files: ./**/Ocaramba.Tests.BrowserStack.xml
          check_name: TestsOnWindowsBrowserStack4
      - name: Upload HTML Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BROWSERSTACK_Report
          path: /Ocaramba.Tests.BrowserStack/bin/Release/ExecutingTestsOnWindowsBrowserStack${{ github.run_id }}.zip
      - name: Upload zip logs as artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ExecutingTestsOnBrowserStackWindows
          path: ./Ocaramba.Tests.BrowserStack/bin/Release/ExecutingTestsOnBrowserStackWindows${{ github.run_id }}.zip
      - name: Upload Windows BrowserStack test results for statistics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows-browserstack
          path: |
            **/Ocaramba.Tests.*.xml
            **/Ocaramba.Tests.*.trx
          if-no-files-found: warn
  test_Stage_RunTestsSeleniumGrid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          ls
          export ASPNETCORE_ENVIRONMENT=Linux
          echo $ASPNETCORE_ENVIRONMENT
          sed -i -e '/Documentation/,+5 d' -e '/Ocaramba.Tests.Appium/,+1 d' -e '/Ocaramba.UnitTests/,+1 d' -e '/Ocaramba.Tests.MsTest/,+1 d' -e '/Ocaramba.Tests.Features/,+1 d' -e '/Ocaramba.Tests.BrowserStack/,+1 d' -e '/Ocaramba.Tests.Xunit/,+1 d' -e '/Ocaramba.Tests.Angular/,+4 d' -e '/Ocaramba.Tests.NUnitExtentReports/,+1 d' ./Ocaramba.sln
      - run: dotnet build ./Ocaramba.sln --configuration ${{ env.buildConfiguration }}
      - run: docker compose -f ./Ocaramba.Tests.NUnit/docker-compose.yml up -d
      - shell: pwsh
        run: ./scripts/ExecutingTestsOnWindowsGithubActions5.ps1
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/linux@v2
        if: always()
        with:
          files: ./**/Ocaramba.Tests.*.xml
          check_name: TestsOnWindows5SeleniumGrid
      - uses: actions/upload-artifact@v4
        with:
          path: WindowsCore5${{ github.run_id }}.zip
          name: WindowsCore5SeleniumGrid
        if: always()
      - name: Upload Selenium Grid test results for statistics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-selenium-grid
          path: |
            **/Ocaramba.Tests.*.xml
            **/Ocaramba.Tests.*.trx
          if-no-files-found: warn
  release_Stage_PublishNuget:
    if: ${{ github.event_name != 'workflow_dispatch' }}
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    needs:
      - test_Stage_RunTestsOnDocker
      - test_Stage_RunTestsOnLinux
      - test_Stage_RunTestsOnLinuxBrowserStack
      - test_Stage_RunTestsOnWindowsCore1
      - test_Stage_RunTestsOnWindowsCore2
      - test_Stage_RunTestsSeleniumGrid
      - test_Stage_RunAppiumTestsOnAndroid
      - test_Stage_RunTestsOnLinuxsaucelabs
      - build_Stage_BuildOnWindows
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Ocaramba${{ env.frameworkVersion }}
      - uses: actions/download-artifact@v4
        with:
          name: OcarambaS${{ env.frameworkVersion }}
      - uses: actions/download-artifact@v4
        with:
          name: OcarambaLite${{ env.frameworkVersion }}
      - uses: actions/download-artifact@v4
        with:
          name: OcarambaLiteS${{ env.frameworkVersion }}
      - shell: pwsh
        run: |
          Get-ChildItem -Recurse
      - name: NuGet login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: raczeja
      - name: Push Nuget Package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push .\Ocaramba.${{ env.frameworkVersion }}.nupkg -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY
        if: (success() && startsWith(github.ref, 'refs/tags/'))
      - name: Push Nuget Package
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push .\OcarambaLite.${{ env.frameworkVersion }}.nupkg -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY
        if: (success() && startsWith(github.ref, 'refs/tags/'))
  deploy:
    needs:
      - build_Stage_BuildOnWindows
      - release_Stage_PublishNuget
      - test_Stage_RunTestsOnDocker
      - test_Stage_RunTestsOnLinux
      - test_Stage_RunAppiumTestsOnAndroid
      - test_Stage_RunTestsOnLinuxBrowserStack
      - test_Stage_RunTestsOnLinuxsaucelabs
      - test_Stage_RunTestsOnWindowsCore1
      - test_Stage_RunTestsOnWindowsCore2
      - test_Stage_RunTestsOnWindowsBrowserStack
      - test_Stage_RunTestsSeleniumGrid
    if: ${{ always() }}
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download API documentation
        uses: actions/download-artifact@v4
        if: ${{ startsWith(github.ref, 'refs/tags/') && needs.build_Stage_BuildOnWindows.result == 'success' }}
        with:
          name: api-documentation
          path: site
      - name: Checkout published API documentation
        if: ${{ !startsWith(github.ref, 'refs/tags/') || needs.build_Stage_BuildOnWindows.result != 'success' }}
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: site
          fetch-depth: 1
          persist-credentials: false
      - name: Download all test results
        uses: actions/download-artifact@v4
        with:
          pattern: test-results-*
          path: test-results
          merge-multiple: false
      - name: Restore published test history
        shell: bash
        run: |
          mkdir -p site/stats/history
          for report in stats/history/runs.json stats/runs.json; do
            response=$(curl --silent --show-error --location \
              --output "site/$report" --write-out '%{http_code}' \
              "https://Accenture.github.io/Ocaramba/$report")
            case "$response" in
              200) echo "Restored $report" ;;
              404) rm -f "site/$report"; echo "No published $report yet" ;;
              *) echo "Unable to restore $report (HTTP $response)" >&2; exit 1 ;;
            esac
          done
      - name: Collect test statistics
        uses: raczeja/test-stats-gh-pages-action@fb384f6dcc9d42eb8867a5222509d485e71cdcf4 # v1.1.6
        with:
          result-files: test-results/**/Ocaramba.Tests.*
          site-directory: site
          stats-subdirectory: stats/history
          history-days: 30
          report-name: All test projects
          dashboard-url: https://Accenture.github.io/Ocaramba/stats/
          shell-test-results: test-results/**/Ocaramba.Tests.*
      - name: Upload site to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      # Deploy test statistics on every run with API documentation from gh-pages or the release artifact.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

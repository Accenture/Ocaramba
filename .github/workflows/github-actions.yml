          name: ExecutingTestsOnsaucelabsLinux
          path: ./Ocaramba.Tests.CloudProviderCrossBrowser/bin/Release/ExecutingTestsOnsaucelabLinux${{ github.run_id }}.zip
      - name: Upload Linux cloud-provider test results for statistics
        uses: actions/upload-artifact@v4
